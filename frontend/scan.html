<!DOCTYPE html>
<html>
<body>
<h2>Scanner un bon</h2>
<video id="video" width="300"></video>
<p id="result"></p>

<script src="https://unpkg.com/jsqr"></script>
<script>
const video = document.getElementById("video");
const result = document.getElementById("result");

// Forcer la caméra arrière
navigator.mediaDevices.getUserMedia({ 
  video: { facingMode: { exact: "environment" } } 
})
.then(stream => {
  video.srcObject = stream;
  video.play();
})
.catch(err => {
  console.error("Erreur caméra arrière, utilisation caméra par défaut", err);
  // fallback caméra par défaut
  navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => { video.srcObject = stream; video.play(); });
});

const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");

setInterval(() => {
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(img.data, img.width, img.height);
    if (code) {
      fetch("https://bons-qr-production.up.railway.app/verify/" + code.data)
        .then(r => r.json())
        .then(d => result.innerText = d.status)
        .catch(e => result.innerText = "Erreur serveur");
    }
  }
}, 500); // scan toutes les 0,5s
</script>
</body>
</html>
